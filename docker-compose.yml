version: "3.8"

services:
  iris:
    build: .
    container_name: iris-v9
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DEBUG=False
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - AEVIBRON_BASE_URL=${AEVIBRON_BASE_URL:-https://aevibron-gateway.vercel.app/api/v1}
      - AEVIBRON_API_KEY=${AEVIBRON_API_KEY}
      - AEVIBRON_ACCESS_TOKEN=${AEVIBRON_ACCESS_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USERNAME=${GITHUB_USERNAME}
      - VERCEL_TOKEN=${VERCEL_TOKEN}
      - IRIS_PASSWORD_HASH=${IRIS_PASSWORD_HASH}
      - IRIS_CREATOR_ID=${IRIS_CREATOR_ID}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/iris_v9.db}
      - PORCUPINE_ACCESS_KEY=${PORCUPINE_ACCESS_KEY}
      - PHONE_BRIDGE_ENABLED=${PHONE_BRIDGE_ENABLED:-False}
      - ADB_DEVICE_ID=${ADB_DEVICE_ID}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./models:/app/models
    networks:
      - iris-network
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: iris-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=iris
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-iris_secret}
      - POSTGRES_DB=iris_v9
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iris-network
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: iris-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - iris-network
    ports:
      - "6379:6379"

volumes:
  postgres-data:
  redis-data:

networks:
  iris-network:
    driver: bridge
